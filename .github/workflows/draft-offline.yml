name: Compilar draft offline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - draft_offline.py
      - 'coach/draft/**'
      - 'coach/datos/**'
      - tests/test_draft_interfaz.py
      - .github/workflows/draft-offline.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_draft_interfaz.py' -v
      - run: python -m unittest discover -s tests -p 'test_sesion_offline.py' -v
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onedir --name DotaDraftOffline --add-data 'coach/datos/recursos/heroes_valve.json;coach/datos/recursos' draft_offline.py
      - run: .\dist\DotaDraftOffline\DotaDraftOffline.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: DotaDraftOffline-Windows
          path: dist/DotaDraftOffline
