name: Compilar importador STRATZ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - actualizador_stratz.py
      - coach/draft/stratz_*.py
      - coach/datos/recursos/heroes_catalogo.json
      - tests/test_stratz_importador.py
      - .github/workflows/stratz-importador.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stratz*.py' -v
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onedir --name DotaStratzImportador --add-data 'coach/datos/recursos/heroes_catalogo.json;coach/datos/recursos' actualizador_stratz.py
      - run: .\dist\DotaStratzImportador\DotaStratzImportador.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: DotaStratzImportador-Windows
          path: dist/DotaStratzImportador
